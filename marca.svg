<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GusMar Studios">
  <title>GusMar Studios</title>
  <!-- Tres fichas en abanico: la familia de apps, no una inicial suelta.
       Cada rect nace centrado en el origen para poder rotarlo sobre SU centro
       y recien despues moverlo; al reves las encima a las tres.
       Medido a 28 px: con mas rotacion o mas separacion se empasta. -->
  <g transform="translate(32 32)">
    <g transform="translate(-11 1) rotate(-11)">
      <rect x="-12" y="-12" width="24" height="24" rx="6.8" fill="#C08B0A" stroke="#0A0B14" stroke-width="3"/>
    </g>
    <g transform="translate(11 1) rotate(11)">
      <rect x="-12" y="-12" width="24" height="24" rx="6.8" fill="#12A0AC" stroke="#0A0B14" stroke-width="3"/>
    </g>
    <g transform="translate(0 -2)">
      <rect x="-13" y="-13" width="26" height="26" rx="7.4" fill="#7C80FF" stroke="#0A0B14" stroke-width="3"/>
    </g>
  </g>
</svg>
